<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yedideri Yönetim</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
:root{--bg:#0f0f0f;--sur:#1a1a1a;--sur2:#222;--bdr:#2a2a2a;--bdr2:#333;--tx:#e8e8e0;--tx2:#888;--tx3:#555;--acc:#c9a84c;--acc2:#e8c96a;--grn:#4ec9a0;--red:#e05555;--org:#e0894a;--blu:#4a9fe0;--r:8px;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;display:flex}
#sidebar{width:220px;min-height:100vh;background:var(--sur);border-right:1px solid var(--bdr);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100}
.logo{padding:24px 20px 20px;border-bottom:1px solid var(--bdr)}
.logo-t{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:3px;color:var(--acc)}
.logo-s{font-size:10px;color:var(--tx3);margin-top:3px;letter-spacing:1px;text-transform:uppercase}
nav{flex:1;padding:12px 0}
.ni{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:13px;color:var(--tx2);transition:all .15s;border-left:2px solid transparent}
.ni:hover{color:var(--tx);background:var(--sur2)}
.ni.active{color:var(--acc);border-left-color:var(--acc);background:rgba(201,168,76,.07)}
.sfooter{padding:16px 20px;border-top:1px solid var(--bdr);font-size:11px;color:var(--tx3);font-family:var(--mono)}
#main{margin-left:220px;flex:1;min-height:100vh}
.topbar{padding:16px 28px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;background:var(--bg);position:sticky;top:0;z-index:10}
.ptitle{font-size:14px;font-weight:500;letter-spacing:.5px}
.tright{display:flex;align-items:center;gap:10px}
.content{padding:28px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.kpi{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi.g::before{background:var(--grn)}.kpi.r::before{background:var(--red)}.kpi.o::before{background:var(--org)}.kpi.b::before{background:var(--blu)}
.kpi-l{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.kpi-v{font-family:var(--mono);font-size:22px;font-weight:600}
.kpi.g .kpi-v{color:var(--grn)}.kpi.r .kpi-v{color:var(--red)}.kpi.o .kpi-v{color:var(--org)}.kpi.b .kpi-v{color:var(--blu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden}
.ch{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.ct{font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--tx2);text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 16px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);background:var(--sur2);font-weight:500;border-bottom:1px solid var(--bdr)}
td{padding:11px 16px;border-bottom:1px solid var(--bdr);color:var(--tx)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-family:var(--mono);font-weight:600}
.bg{background:rgba(78,201,160,.12);color:var(--grn)}.bo{background:rgba(224,137,74,.12);color:var(--org)}.br{background:rgba(224,85,85,.12);color:var(--red)}.bb{background:rgba(74,159,224,.12);color:var(--blu)}.ba{background:rgba(201,168,76,.12);color:var(--acc)}
.btn{padding:8px 16px;border-radius:5px;border:none;cursor:pointer;font-size:12px;font-family:var(--sans);font-weight:500;transition:opacity .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{opacity:.85}
.btn-p{background:var(--acc);color:#1a1500}.btn-gh{background:var(--sur2);color:var(--tx2);border:1px solid var(--bdr2)}.btn-d{background:rgba(224,85,85,.15);color:var(--red);border:1px solid rgba(224,85,85,.2)}.btn-s{background:rgba(78,201,160,.15);color:var(--grn);border:1px solid rgba(78,201,160,.2)}.btn-b{background:rgba(74,159,224,.15);color:var(--blu);border:1px solid rgba(74,159,224,.2)}
.sm{padding:5px 10px;font-size:11px}
.fg{margin-bottom:14px}
label{display:block;font-size:11px;color:var(--tx3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{width:100%;background:var(--sur2);border:1px solid var(--bdr2);border-radius:5px;color:var(--tx);padding:9px 12px;font-size:13px;font-family:var(--sans);outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
select option{background:var(--sur2)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fi .15s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.md{background:var(--sur);border:1px solid var(--bdr2);border-radius:10px;width:500px;max-width:95vw;max-height:88vh;overflow-y:auto;animation:su .2s}
.md-lg{width:680px}
@keyframes su{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.mh{padding:18px 22px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.mt{font-size:15px;font-weight:600}
.mx{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:20px;line-height:1}
.mx:hover{color:var(--tx)}
.mb{padding:22px}
.mf{padding:14px 22px;border-top:1px solid var(--bdr);display:flex;gap:8px;justify-content:flex-end}
.load{display:flex;align-items:center;justify-content:center;padding:48px;color:var(--tx3);font-size:13px;gap:10px}
.spin{width:16px;height:16px;border:2px solid var(--bdr2);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:32px;text-align:center;color:var(--tx3);font-size:13px}
.cw{padding:16px 18px;height:210px}
.pr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bdr);font-size:12px}
.pr:last-child{border:none}
.pd{color:var(--tx3);font-family:var(--mono)}.pa{color:var(--grn);font-family:var(--mono);font-weight:600}.pn{color:var(--tx2);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ir{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bdr);font-size:13px}
.ir:last-child{border:none}
.il{color:var(--tx2)}.iv{font-family:var(--mono)}
.kat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:14px}
.ki{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--sur2);border-radius:5px;font-size:12px}
.kn{color:var(--tx2)}.kv{font-family:var(--mono);color:var(--org)}
.mono{font-family:var(--mono)}.tg{color:var(--grn)}.tr{color:var(--red)}.ta{color:var(--acc)}.td{color:var(--tx2)}.tr2{text-align:right}
.irow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.totrow td{background:rgba(201,168,76,.06);font-weight:600;border-top:1px solid var(--bdr2)}
.sb{display:flex;gap:10px;margin-bottom:16px}
.sb input{flex:1}
.tabs{display:flex;gap:2px;margin-bottom:20px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:4px;width:fit-content}
.tab{padding:7px 16px;border-radius:5px;font-size:12px;cursor:pointer;color:var(--tx2);transition:all .15s}
.tab.active{background:var(--sur2);color:var(--tx);border:1px solid var(--bdr2)}
.stok-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.sk{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px;text-align:center}
.sk-l{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.sk-v{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--acc)}
</style>
</head>
<body>
<div id="sidebar">
  <div class="logo"><div class="logo-t">YEDİDERİ</div><div class="logo-s">Yönetim Sistemi</div></div>
  <nav id="nav">
    <div class="ni active" data-page="dashboard"><span>◈</span> Dashboard</div>
    <div class="ni" data-page="invoices"><span>▤</span> Faturalar</div>
    <div class="ni" data-page="customers"><span>◎</span> Müşteriler</div>
    <div class="ni" data-page="gider"><span>↓</span> Giderler</div>
    <div class="ni" data-page="products"><span>◧</span> Ürünler</div>
    <div class="ni" data-page="stok"><span>⊡</span> Stok</div>
    <div class="ni" data-page="teklif"><span>✦</span> Özel Teklif</div>
    <div class="ni" data-page="print"><span>⎙</span> Baskı Merkezi</div>
    <div class="ni" data-page="settings"><span>⚙</span> Ayarlar</div>
  </nav>
  <div class="sfooter" id="usd-display">USD/TRY: —</div>
</div>
<div id="main">
  <div class="topbar">
    <div class="ptitle" id="ptitle">Dashboard</div>
    <div class="tright" id="tright"></div>
  </div>
  <div class="content" id="content"><div class="load"><div class="spin"></div>Yükleniyor...</div></div>
</div>
<div id="mroot"></div>

<script>
const fmt = n => Number(n||0).toLocaleString('tr-TR',{maximumFractionDigits:0});
const fmtK = n => n>=1000?(n/1000).toFixed(1)+'K':fmt(n);
const $ = id => document.getElementById(id);
const KATS = ['Deri Alımı','İşçilik / Maaş','Kira','Malzeme','Vergi / SGK','Kargo / Lojistik','Pazarlama','Elektrik / Su / Doğalgaz','Diğer'];

async function api(path,opts={}){
  const r = await fetch('/api'+path,{headers:{'Content-Type':'application/json'},...opts,body:opts.body?JSON.stringify(opts.body):undefined});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
function sbadge(s){
  const m={odendi:['✓ Ödendi','bg'],beklemede:['⏳ Beklemede','bo'],kismi:['◑ Kısmi','ba']};
  const[t,c]=m[s]||[s,'bb'];return`<span class="badge ${c}">${t}</span>`;
}
function showM(html){$('mroot').innerHTML=`<div class="mo" id="ov">${html}</div>`;$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});}
function closeM(){$('mroot').innerHTML='';}
function loading(){$('content').innerHTML='<div class="load"><div class="spin"></div>Yükleniyor...</div>';}

// Router
document.getElementById('nav').addEventListener('click',e=>{
  const item=e.target.closest('.ni');if(!item)return;
  document.querySelectorAll('.ni').forEach(i=>i.classList.remove('active'));
  item.classList.add('active');
  $('ptitle').textContent=item.textContent.trim();
  $('tright').innerHTML='';
  renderPage(item.dataset.page);
});

async function renderPage(p){
  loading();
  try{
    if(p==='dashboard') await renderDash();
    else if(p==='invoices') await renderInvoices();
    else if(p==='customers') await renderCustomers();
    else if(p==='gider') await renderGider();
    else if(p==='products') await renderProducts();
    else if(p==='stok') await renderStok();
    else if(p==='teklif') await renderTeklif();
    else if(p==='print') renderPrint();
    else if(p==='settings') await renderSettings();
  }catch(e){$('content').innerHTML=`<div class="empty">⚠ Hata: ${e.message}</div>`;}
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
async function renderDash(){
  const[d,s]=await Promise.all([api('/dashboard'),api('/settings')]);
  $('usd-display').textContent=`USD/TRY: ${s.usd_to_tl} ₺`;
  const{kpis,bekleyen_list,chart,stats}=d;
  $('content').innerHTML=`
  <div class="kpi-grid">
    <div class="kpi g"><div class="kpi-l">Bu Ay Ciro</div><div class="kpi-v">${fmtK(kpis.ciro_ay)} ₺</div></div>
    <div class="kpi r"><div class="kpi-l">Bekleyen Tahsilat</div><div class="kpi-v">${fmtK(kpis.bekleyen)} ₺</div></div>
    <div class="kpi o"><div class="kpi-l">Bu Ay Gider</div><div class="kpi-v">${fmtK(kpis.gider_ay)} ₺</div></div>
    <div class="kpi b"><div class="kpi-l">Net Kâr (Tahmini)</div><div class="kpi-v">${fmtK(kpis.net_kar)} ₺</div></div>
  </div>
  <div class="g3">
    <div class="card"><div class="ch"><span class="ct">Aylık Ciro — Son 6 Ay</span></div><div class="cw"><canvas id="chart-m"></canvas></div></div>
    <div class="card"><div class="ch"><span class="ct">Özet</span></div><div style="padding:16px">
      <div class="ir"><span class="il">Toplam Müşteri</span><span class="iv">${stats.total_customers}</span></div>
      <div class="ir"><span class="il">Toplam Fatura</span><span class="iv">${stats.total_invoices}</span></div>
      <div class="ir"><span class="il">Bekleyen Borç</span><span class="iv tr">${fmt(kpis.bekleyen)} ₺</span></div>
      <div class="ir"><span class="il">Bu Ay Gider</span><span class="iv ta">${fmt(kpis.gider_ay)} ₺</span></div>
    </div></div>
  </div>
  <div class="card"><div class="ch"><span class="ct">Borçlu Müşteriler</span></div>
  <table><thead><tr><th>Müşteri</th><th>Fatura</th><th>Durum</th><th class="tr2">Kalan Borç</th></tr></thead>
  <tbody>${bekleyen_list.length?bekleyen_list.map(b=>`<tr>
    <td style="font-weight:500">${b.name}</td>
    <td class="mono td" style="font-size:11px">${b.inv_id}</td>
    <td>${sbadge(b.status)}</td>
    <td class="tr2 mono tr">${fmt(b.amt)} ₺</td>
  </tr>`).join(''):'<tr><td colspan="4" class="empty">Bekleyen borç yok ✓</td></tr>'}</tbody>
  </table></div>`;
  new Chart($('chart-m'),{type:'bar',data:{labels:chart.labels,datasets:[
    {label:'Ciro',data:chart.ciro,backgroundColor:'rgba(78,201,160,.5)',borderColor:'#4ec9a0',borderWidth:1,borderRadius:3},
    {label:'Gider',data:chart.gider,backgroundColor:'rgba(224,85,85,.35)',borderColor:'#e05555',borderWidth:1,borderRadius:3}
  ]},options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:'#888',font:{size:11}}}},
    scales:{x:{ticks:{color:'#666',font:{size:10}},grid:{color:'#1f1f1f'}},
            y:{ticks:{color:'#666',font:{size:10},callback:v=>fmtK(v)},grid:{color:'#1f1f1f'}}}}});
}

// ── Invoices ──────────────────────────────────────────────────────────────────
let allInv=[];
async function renderInvoices(){
  allInv=await api('/invoices');
  $('tright').innerHTML=`<button class="btn btn-p sm" onclick="newInvModal()">+ Yeni Fatura</button><input id="isrch" placeholder="Ara..." style="width:160px;padding:6px 10px;font-size:12px" oninput="filterInv(this.value)">`;
  dispInvGrouped(allInv);
}
function filterInv(q){q=q.toLowerCase();dispInvGrouped(allInv.filter(i=>i.id.toLowerCase().includes(q)||(i.customer_name||'').toLowerCase().includes(q)));}

// نمایش گروه‌بندی شده فاکتورها بر اساس مشتری
function dispInvGrouped(list){
  const grouped={};
  list.forEach(inv=>{
    const cid=inv.customer_id||'unknown';
    if(!grouped[cid]) grouped[cid]={customer:inv.customer_name||'—',invoices:[]};
    grouped[cid].invoices.push(inv);
  });
  let html=`<div class="card"><div class="ch"><span class="ct">Müşteriler ve Faturalar (${Object.keys(grouped).length})</span></div>
  <table><thead><tr><th>Müşteri</th><th>Fatura Sayısı</th><th>Son Fatura</th><th>Durum</th><th class="tr2">Toplam Borç</th><th class="tr2">Ödenen</th><th class="tr2">Kalan</th><th></th></tr></thead><tbody>`;
  Object.keys(grouped).forEach(cid=>{
    const g=grouped[cid];
    const totalBorc=g.invoices.reduce((s,i)=>s+parseFloat(i.total||0),0);
    const totalOdenen=g.invoices.reduce((s,i)=>s+parseFloat(i.paid_total||0),0);
    const totalKalan=g.invoices.reduce((s,i)=>s+parseFloat(i.kalan||0),0);
    const sonInv=g.invoices.sort((a,b)=>b.date.localeCompare(a.date))[0];
    const durum=totalKalan<=0.01?'odendi':(totalOdenen>0?'kismi':'beklemede');
    html+=`<tr>
      <td style="font-weight:500">${g.customer}</td>
      <td class="mono td" style="font-size:12px">${g.invoices.length}</td>
      <td class="td" style="font-size:12px">${sonInv?sonInv.id:'—'}</td>
      <td>${sbadge(durum)}</td>
      <td class="tr2 mono">${fmt(totalBorc)} ₺</td>
      <td class="tr2 mono tg">${fmt(totalOdenen)} ₺</td>
      <td class="tr2 mono ${totalKalan>0.01?'tr':'tg'}">${fmt(totalKalan)} ₺</td>
      <td style="white-space:nowrap">
        <button class="btn btn-gh sm" onclick="showCustomerInvoices('${cid}')">Faturaları Göster</button>
        <button class="btn btn-b sm" onclick="addPayCust('${cid}')">+ Ödeme</button>
      </td>
    </tr>`;
  });
  html+=`</tbody></table></div>`;
  $('content').innerHTML=html;
}

// نمایش تمام فاکتورهای یک مشتری
async function showCustomerInvoices(cid){
  const invs=allInv.filter(i=>i.customer_id===cid);
  let html=`<div class="md md-lg"><div class="mh"><span class="mt">Faturalar</span><button class="mx" onclick="closeM()">×</button></div>
  <div class="mb"><table><thead><tr><th>Fatura No</th><th>Tarih</th><th>Durum</th><th class="tr2">Toplam</th><th class="tr2">Ödenen</th><th class="tr2">Kalan</th><th></th></tr></thead><tbody>`;
  invs.forEach(inv=>{
    html+=`<tr>
      <td class="mono" style="font-size:12px">${inv.id}</td>
      <td class="td" style="font-size:12px">${(inv.date||'').substring(0,10)}</td>
      <td>${sbadge(inv.status)}</td>
      <td class="tr2 mono">${fmt(inv.total)} ₺</td>
      <td class="tr2 mono tg">${fmt(inv.paid_total)} ₺</td>
      <td class="tr2 mono ${inv.kalan>0.01?'tr':'tg'}">${fmt(inv.kalan)} ₺</td>
      <td style="white-space:nowrap">
        <button class="btn btn-gh sm" onclick="invDetail('${inv.id}')">Detay</button>
        <button class="btn btn-b sm" onclick="printInv('${inv.id}')">⎙</button>
        <button class="btn btn-s sm" onclick="editInvoice('${inv.id}')">Düzenle</button>
        ${inv.kalan>0.01?`<button class="btn btn-s sm" onclick="addPayM('${inv.id}')">+ Ödeme</button>`:''}
      </td>
    </tr>`;
  });
  html+=`</tbody></table></div>
  <div class="mf"><button class="btn btn-gh" onclick="closeM()">Kapat</button></div></div>`;
  showM(html);
}

async function invDetail(id){
  const inv=allInv.find(i=>i.id===id);if(!inv)return;
  const pmts=inv.payments||[];
  const paidField=parseFloat(inv.paid||0);
  let payHtml=pmts.length===0&&paidField>0
    ?`<div class="pr"><span class="pd">(eski kayıt)</span><span class="pn td">Detay yok</span><span class="pa">${fmt(paidField)} ₺</span></div>`
    :pmts.length===0?'<div class="td" style="font-size:12px;padding:8px 0">Ödeme kaydı yok</div>'
    :pmts.map((p,i)=>`<div class="pr">
      <span class="pd">${p.tarih}</span>
      <span class="pn">${p.not||'—'}</span>
      <span class="pa">${fmt(p.tutar)} ₺</span>
      <button class="btn btn-d" style="padding:2px 7px;font-size:10px" onclick="delPay('${id}',${i})">✕</button>
    </div>`).join('');
  const items=(inv.items||[]).map((it,i)=>`<tr>
    <td class="mono" style="font-size:12px">${it.code}</td>
    <td>${it.desc||it.name||'—'}</td>
    <td class="tr2">${it.qty}</td>
    <td class="tr2 mono">${fmt(it.price)} ₺</td>
    <td class="tr2 mono">${fmt(parseFloat(it.qty)*parseFloat(it.price))} ₺</td>
    <td><button class="btn btn-d" style="padding:2px 6px;font-size:10px" onclick="removeItem('${id}',${i})">✕</button></td>
  </tr>`).join('');
  showM(`<div class="md"><div class="mh"><span class="mt">${id}</span><button class="mx" onclick="closeM()">×</button></div>
  <div class="mb">

async function addPayCust(cid){
  const invs=allInv.filter(i=>i.customer_id===cid && parseFloat(i.kalan||0)>0.01);
  if(!invs.length){alert('این مشتری هیچ بدهی ندارد');return;}
  const totalKalan=invs.reduce((s,i)=>s+parseFloat(i.kalan||0),0);
  showM(`<div class="md"><div class="mh"><span class="mt">Ödeme Ekle — ${invs[0].customer_name}</span><button class="mx" onclick="closeM()">×</button></div>
  <div class="mb">
    <div style="background:var(--sur2);border-radius:6px;padding:12px;margin-bottom:14px;display:flex;justify-content:space-between">
      <span class="td" style="font-size:12px">Toplam Borç</span>
      <span class="mono tr" style="font-size:16px;font-weight:600">${fmt(totalKalan)} ₺</span>
    </div>
    <div class="fg"><label>Ödeme Tutarı (₺)</label><input type="number" id="pa-cust" value="${Math.floor(totalKalan)}" step="0.01"></div>
    <div class="fg"><label>Açıklama</label><input type="text" id="pn-cust" placeholder="Nakit, EFT, vb."></div>
    <div style="margin-top:10px;font-size:11px;color:var(--tx3)">Bu ödeme en eski faturadan başlayarak otomatik dağıtılacaktır.</div>
  </div>
  <div class="mf"><button class="btn btn-p" onclick="savePayCust('${cid}')">💰 Kaydet</button><button class="btn btn-gh" onclick="closeM()">İptal</button></div>
  </div>`);
}
async function savePayCust(cid){
  const amt=parseFloat($('pa-cust').value),note=$('pn-cust').value;
  if(!amt||amt<=0){alert('Geçerli tutar girin');return;}
  const invs=allInv.filter(i=>i.customer_id===cid && parseFloat(i.kalan||0)>0.01).sort((a,b)=>a.date.localeCompare(b.date));
  let kalanAmt=amt;
  for(const inv of invs){
    if(kalanAmt<=0)break;
    const invKalan=parseFloat(inv.kalan||0);
    const payment=Math.min(kalanAmt,invKalan);
    await api(`/invoices/${inv.id}/payment`,{method:'POST',body:{tutar:payment,note:note||'Dağıtılmış ödeme'}});
    kalanAmt-=payment;
  }
  closeM();allInv=await api('/invoices');dispInvGrouped(allInv);
}

async function saveEditInv(id){
  const inv=allInv.find(i=>i.id===id);if(!inv)return;
  const cid=$('ei-cust').value;if(!cid){alert('Müşteri seçin');return;}
  const items=[];
  document.querySelectorAll('#ei-items .item-row, #ei-items > div').forEach(el=>{
    const codeEl=el.querySelector('.item-code');
    const descEl=el.querySelector('.item-desc');
    const qtyEl=el.querySelector('.item-qty');
    const priceEl=el.querySelector('.item-price');
    if(descEl&&qtyEl&&priceEl){
      items.push({code:codeEl?codeEl.value:'',desc:descEl.value,qty:parseFloat(qtyEl.value)||1,price:parseFloat(priceEl.value)||0});
    }
  });
  if(!items.length){alert('En az bir kalem ekleyin');return;}
  await api(`/invoices/${id}`,{method:'PUT',body:{customer_id:cid,items,discount:parseFloat($('ei-disc').value)||0,payment:inv.payment||'Nakit',notes:$('ei-notes').value,date:$('ei-date').value}});

  <div class="fg"><label>Tutar (₺) *</label><input type="number" id="gv" value="${g?.tutar||''}" step="0.01"></div>

function newGdrM(){
  showM(`<div class="md"><div class="mh"><span class="mt">Gider Ekle</span><button class="mx" onclick="closeM()">×</button></div>
  <div class="mb">${gdrForm()}</div>
  <div class="mf"><button class="btn btn-p" onclick="saveGdr()">Kaydet</button><button class="btn btn-gh" onclick="closeM()">İptal</button></div></div>`);
}
function editGdrM(id){
  const g=allGdr.find(x=>x.id===id);if(!g)return;
  showM(`<div class="md"><div class="mh"><span class="mt">Gider Düzenle</span><button class="mx" onclick="closeM()">×</button></div>
  <div class="mb">${gdrForm(g)}</div>
  <div class="mf"><button class="btn btn-p" onclick="saveGdr(${id})">Kaydet</button><button class="btn btn-gh" onclick="closeM()">İptal</button></div></div>`);
}
async function saveGdr(id=null){
  const a=$('ga').value,v=parseFloat($('gv').value);
  if(!a||!v){alert('Açıklama ve tutar zorunlu');return;}
  const body={tarih:$('gt').value,aciklama:a,kategori:$('gk').value,tutar:v,note:$('gn').value};
  if(id) await api(`/gider/${id}`,{method:'PUT',body});
  else await api('/gider',{method:'POST',body});
  closeM();await renderGider();
}
async function delGdr(id){if(!confirm('Silinsin mi?'))return;await api(`/gider/${id}`,{method:'DELETE'});await renderGider();}

  <div class="card"><div class="ch"><span class="ct">Ürün Listesi</span></div>
  <table><thead><tr><th>Kod</th><th>Alan dm²</th><th>Süre</th><th class="tr2">Maliyet</th><th class="tr2">Satış</th><th class="tr2">Trendyol</th><th></th></tr></thead>

      <td class="mono" style="font-weight:600">${p.code}</td>

function filterProd(q){q=q.toLowerCase();document.querySelectorAll('#pbody tr').forEach(tr=>{tr.style.display=tr.dataset.code.includes(q)?'':'none';});}

// ── Stok ──────────────────────────────────────────────────────────────────────
async function renderStok(){
  const stok=await api('/stok');
  const entries=Object.entries(stok).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,[,v])=>s+v,0);
  const lowCount=entries.filter(([,v])=>v<=3).length;
  $('content').innerHTML=`
  <div class="stok-kpi">
    <div class="sk"><div class="sk-l">Toplam Stok</div><div class="sk-v">${total}</div></div>
    <div class="sk"><div class="sk-l">Ürün Çeşidi</div><div class="sk-v">${entries.length}</div></div>
    <div class="sk"><div class="sk-l">Düşük Stok (≤3)</div><div class="sk-v" style="color:var(--red)">${lowCount}</div></div>
    <div class="sk"><div class="sk-l">En Yüksek Stok</div><div class="sk-v">${entries.length?entries[0][1]:0}</div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="ch"><span class="ct">Stok Durumu</span>
      <button class="btn btn-p sm" onclick="stokHareketM()">+ Hareket Ekle</button>
    </div>
    <table><thead><tr><th>Ürün/Varyant</th><th class="tr2">Stok</th><th>Durum</th></tr></thead>
    <tbody>${entries.map(([k,v])=>`<tr>
      <td class="mono">${k}</td>
      <td class="tr2 mono" style="font-weight:600;color:${v<=3?'var(--red)':v<=10?'var(--org)':'var(--grn)'}">${v}</td>
      <td>${v<=3?'<span class="badge br">Düşük</span>':v<=10?'<span class="badge bo">Az</span>':'<span class="badge bg">Normal</span>'}</td>
    </tr>`).join('')||'<tr><td colspan="3" class="empty">Stok kaydı yok</td></tr>'}</tbody></table></div>
    <div class="card"><div class="ch"><span class="ct">Hızlı Giriş</span></div>
    <div style="padding:16px">
      <div class="fg"><label>Ürün Kodu</label><input id="sk-code" placeholder="c09"></div>
      <div class="fg"><label>Renk (opsiyonel)</label><input id="sk-renk" placeholder="Kahverengi"></div>
      <div class="fg"><label>Adet</label><input type="number" id="sk-qty" value="1" min="1"></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-s" style="flex:1" onclick="stokGiris('uretim')">+ Üretim</button>
        <button class="btn btn-d" style="flex:1" onclick="stokGiris('satis')">− Satış</button>
      </div>
    </div></div>
  </div>`;
}
async function stokGiris(tip){
  const code=$('sk-code').value.trim();if(!code){alert('Kod girin');return;}
  const qty=parseInt($('sk-qty').value)||1;
  const renk=$('sk-renk').value.trim();
  try{
    await api(`/stok/${tip}`,{method:'POST',body:{code,renk,qty}});
    await renderStok();
  }catch(e){alert('Hata: '+e.message);}
}
async function stokHareketM(){
  showM(`<div class="md"><div class="mh"><span class="mt">Stok Hareketi</span><button class="mx" onclick="closeM()">×</button></div>
  <div class="mb">
    <div class="fg"><label>Ürün Kodu</label><input id="sh-code" placeholder="c09"></div>
    <div class="fg"><label>Renk (opsiyonel)</label><input id="sh-renk" placeholder="Kahverengi"></div>
    <div class="fg"><label>Adet</label><input type="number" id="sh-qty" value="1" min="1"></div>
  </div>
  <div class="mf">
    <button class="btn btn-s" onclick="saveStokM('uretim')">+ Üretim</button>
    <button class="btn btn-d" onclick="saveStokM('satis')">− Satış</button>
    <button class="btn btn-gh" onclick="closeM()">İptal</button>
  </div></div>`);
}
async function saveStokM(tip){
  const code=$('sh-code').value.trim();if(!code){alert('Kod girin');return;}
  const qty=parseInt($('sh-qty').value)||1;const renk=$('sh-renk').value.trim();
  try{await api(`/stok/${tip}`,{method:'POST',body:{code,renk,qty}});closeM();await renderStok();}
  catch(e){alert('Hata: '+e.message);}
}

async function calcTeklif(){
  const body={uzunluk:parseFloat($('tl').value),genislik:parseFloat($('tw').value),
    sure:parseFloat($('ts').value),mat:parseFloat($('tm').value),
    logo_tl:parseFloat($('tlo').value),klise_tl:parseFloat($('tkl').value),
    margin:parseFloat($('tmr').value),tirajlar:[10,50,100,500,1000]};
  const res=await api('/teklif/hesapla',{method:'POST',body});
  $('teklif-result').style.display='block';
  $('teklif-rows').innerHTML=res.results.map(r=>`<tr>
    <td class="mono">${r.qty} adet</td>
    <td class="tr2 mono td">${fmt(r.maliyet)} ₺</td>
    <td class="tr2 mono tg" style="font-weight:600">${fmt(r.birim)} ₺</td>
    <td class="tr2 mono ta">${fmt(r.toplam)} ₺</td>
  </tr>`).join('');
  $('teklif-info').innerHTML=`Alan: <strong>${res.alan} dm²</strong> · Deri Maliyeti: <strong>${fmt(res.deri_tl)} ₺</strong> · İşçilik: <strong>${fmt(res.iscilik)} ₺</strong>`;
